    <rect x="714" y="228" width="188" height="106" rx="16" fill="#121d35" stroke="#2a3a5d"/><circle cx="746" cy="260" r="15" fill="#6d4a25" opacity=".58"/><path d="M740 254h12m-12 6h12m-12 6h8" stroke="#ffc477" stroke-width="2" stroke-linecap="round"/><text x="772" y="265" fill="#ecf2ff" font-size="16" font-weight="700">制定计划</text><text x="734" y="301" fill="#8592ad" font-size="12">拆解目标、里程碑和风险</text>
    <rect x="918" y="228" width="188" height="106" rx="16" fill="#121d35" stroke="#2a3a5d"/><circle cx="950" cy="260" r="15" fill="#5e315e" opacity=".58"/><path d="M944 265l6-11 6 11m-9-4h6" stroke="#e9a4f1" stroke-width="2" stroke-linejoin="round"/><text x="976" y="265" fill="#ecf2ff" font-size="16" font-weight="700">解读文件</text><text x="938" y="301" fill="#8592ad" font-size="12">提炼重点、风险和行动项</text>
  </g>
  <rect x="322" y="382" width="768" height="118" rx="20" fill="#0d162b" stroke="#34476f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="420" fill="#65738f" font-size="14" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">发消息给 Fusion AI…</text>
  <rect x="350" y="451" width="72" height="28" rx="14" fill="#17253f"/><text x="367" y="470" fill="#b6c7e8" font-size="11" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">知识库</text>
  <rect x="782" y="451" width="70" height="28" rx="14" fill="#17253f"/><text x="799" y="470" fill="#8fb3ff" font-size="11" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">思考 开</text>
  <rect x="861" y="451" width="82" height="28" rx="14" fill="#17253f"/><text x="879" y="470" fill="#b6c7e8" font-size="11" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">执行 自动</text>
  <rect x="952" y="447" width="112" height="36" rx="18" fill="url(#brand)"/><text x="1008" y="470" text-anchor="middle" fill="#08101e" font-size="12" font-weight="750" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">选择模型</text>
  <text x="706" y="548" text-anchor="middle" fill="#55627d" font-size="12" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">任务目标 · 模型能力 · 执行模式 · 知识边界</text>
</svg>
