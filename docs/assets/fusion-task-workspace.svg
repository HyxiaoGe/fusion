  <text x="88" y="72" fill="#f4f7ff" font-size="22" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Fusion AI</text>
  <rect x="48" y="105" width="170" height="42" rx="12" fill="#18233e" stroke="#33456e"/>
  <text x="74" y="132" fill="#dfe8ff" font-size="14" font-weight="600" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">＋ 新对话</text>
  <rect x="48" y="166" width="170" height="34" rx="10" fill="#10192e"/>
  <text x="68" y="188" fill="#7f8aa5" font-size="12" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">搜索对话…</text>
  <text x="48" y="242" fill="#66728f" font-size="11" font-weight="700" letter-spacing="1.4" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">任务工作台</text>
  <rect x="48" y="262" width="170" height="54" rx="12" fill="#111b31"/>
  <circle cx="72" cy="289" r="9" fill="#7c8cff" opacity=".85"/>
  <rect x="90" y="278" width="91" height="7" rx="3.5" fill="#63708c"/><rect x="90" y="294" width="66" height="6" rx="3" fill="#37445f"/>
  <rect x="48" y="326" width="170" height="54" rx="12" fill="#111b31"/>
  <circle cx="72" cy="353" r="9" fill="#52c7a5" opacity=".85"/>
  <rect x="90" y="342" width="78" height="7" rx="3.5" fill="#63708c"/><rect x="90" y="358" width="98" height="6" rx="3" fill="#37445f"/>
