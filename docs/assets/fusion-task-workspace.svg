<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Fusion 任务首页</title>
  <desc id="desc">Fusion 从任务目标开始的工作台界面示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d1a"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c8cff"/><stop offset="1" stop-color="#69d6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="564" rx="22" fill="#0d1325" stroke="#263352"/>
  <rect x="28" y="28" width="210" height="564" rx="22" fill="#0a1020"/>
  <rect x="237" y="28" width="1" height="564" fill="#263352"/>
