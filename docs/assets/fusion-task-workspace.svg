    <text x="705" y="113" text-anchor="middle" fill="#8e9ab6" font-size="14" font-weight="600">从一个任务开始，随时可以修改</text>
    <text x="705" y="158" text-anchor="middle" fill="#f6f8ff" font-size="34" font-weight="750">今天想完成什么？</text>
    <text x="705" y="188" text-anchor="middle" fill="#7f8aa5" font-size="14">选择一个方向，再补充你的材料和要求</text>
  </g>
