  <rect x="864" y="238" width="234" height="58" rx="12" fill="#14213a"/><text x="880" y="259" fill="#73819c" font-size="10" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">能力包</text><text x="880" y="281" fill="#dfe8fb" font-size="12" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">查证搜索 · verified_web</text>
