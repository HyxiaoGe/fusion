      <circle cx="570" cy="244" r="14" fill="#61c2cf"/><text x="570" y="248" text-anchor="middle" fill="#07101d" font-size="10" font-weight="800">4</text><text x="570" y="278" text-anchor="middle" fill="#aebbd4" font-size="10">Read</text>
