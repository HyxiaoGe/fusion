    <linearGradient id="line3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#778bff"/><stop offset="1" stop-color="#65d8c5"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg3)"/>
  <rect x="28" y="28" width="1144" height="564" rx="22" fill="#0d1424" stroke="#263551"/>
  <rect x="28" y="28" width="1144" height="58" rx="22" fill="#0a1120"/>
  <circle cx="61" cy="57" r="12" fill="#7c8cff"/><text x="84" y="64" fill="#f3f6ff" font-size="20" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Fusion AI</text>
  <text x="504" y="63" fill="#7785a0" font-size="12" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">聊天</text>
  <rect x="555" y="43" width="86" height="30" rx="15" fill="#17243d"/><text x="598" y="63" text-anchor="middle" fill="#eef3ff" font-size="12" font-weight="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">轨迹</text>
  <text x="72" y="130" fill="#f1f5ff" font-size="23" font-weight="750" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">会话轨迹</text>
  <text x="72" y="157" fill="#71809d" font-size="12" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Turn 1 · Run 1 · 轨迹完整 · 4.82 秒</text>
  <rect x="865" y="116" width="114" height="32" rx="16" fill="#17243d"/><text x="922" y="137" text-anchor="middle" fill="#aebfe2" font-size="11" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">顺序</text>
  <rect x="989" y="116" width="134" height="32" rx="16" fill="#101a2e"/><text x="1056" y="137" text-anchor="middle" fill="#70809e" font-size="11" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">实际耗时</text>
