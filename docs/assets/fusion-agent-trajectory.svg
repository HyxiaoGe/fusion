    <text x="864" y="413" fill="#74819c" font-size="10">上下文</text><text x="1098" y="413" text-anchor="end" fill="#71d8be" font-size="11">充足 · 98% 剩余</text><line x1="864" y1="428" x2="1098" y2="428" stroke="#263654"/>
    <text x="864" y="455" fill="#74819c" font-size="10">轨迹</text><text x="1098" y="455" text-anchor="end" fill="#71d8be" font-size="11">完整</text><line x1="864" y1="470" x2="1098" y2="470" stroke="#263654"/>
    <text x="864" y="497" fill="#74819c" font-size="10">能力指纹</text><text x="1098" y="497" text-anchor="end" fill="#9eb4dc" font-size="11">sha256:7c41d9…</text>
