version: "1"
workflow: .github/workflows/_deploy-api.yml
contract_test:
  path: .github/scripts/release-safety-contract.sh
  manifest: backend/release-safety.yml
  pr_step: release_safety_contract
parameter_contract:
  workflow: .github/workflows/_deploy-app.yml
  app: api
  validation_step: app_contract
  inputs:
    app: api
    image_repository: seanfield/fusion-api
    health_check_endpoint: http://127.0.0.1:8002/health
    migration_enabled: true
    dependency_services: postgres,redis,litellm,flyai-adapter,knowledge-worker
    rollback_anchor_policy: api-and-adapter-image-identities
jobs:
  prepare: prepare
  publish: publish
  deploy: deploy-dev
  finalize: finalize
steps:
  target: deployment_request
  target_job: prepare
  capture: capture_rollback_target
  migrations: [apply_migrations]
  candidate: deploy_candidate
  verify: [verify_image_identity, verify_health, deployment_smoke]
  rollback: rollback_failed_deployment
  cleanup: cleanup_old_images
  failure: null
  finalize: finalize_release_result
  finalize_failure: null
needs:
  publish: [prepare]
  deploy: [prepare, publish]
  finalize: [prepare, publish, deploy]
conditions:
  prepare: null
  publish: >-
    github.ref == 'refs/heads/master' && needs.prepare.outputs.rollback_requested != 'true'
  deploy: >-
    always() && github.ref == 'refs/heads/master' &&
    needs.prepare.result == 'success' &&
    ((needs.prepare.outputs.rollback_requested == 'true' && needs.publish.result == 'skipped') ||
    (needs.prepare.outputs.rollback_requested != 'true' && needs.publish.result == 'success'))
  migration: inputs.migration_enabled && needs.prepare.outputs.rollback_requested != 'true'
  rollback: >-
    failure() && steps.capture_rollback_target.outcome == 'success' &&
    steps.deploy_candidate.outcome != 'skipped'
  cleanup: success()
  failure: null
  finalize: always() && github.ref == 'refs/heads/master'
  finalize_failure: null
