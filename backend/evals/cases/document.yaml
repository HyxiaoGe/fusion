# 交付物文档（#221–#227）：明确要文档时生成 document 内容块。
category: document
cases:
  - id: explicit-document-request
    source: doc-accept 2026-10-02（#221–#227）
    message: 帮我写一份新员工入职第一周的工作安排文档
    checks:
      - type: tool_called
        tool: create_document
        max_count: 1
      - type: answer_block
        block_type: document

  - id: short-answer-no-document
    source: doc-accept 2026-10-02（对照组：普通问答不应生成文档）
    message: 一句话解释什么是 HTTP 缓存
    checks:
      - type: tool_not_called
        tool: create_document
      - type: answer_block
        block_type: document
        present: false

  - id: trip-guide-document-uses-itinerary-tools
    source: 每日探针 2026-10-03 / 10-04 doubao "只用了联网 主工具未调用 未生成文档"（青岛、厦门三日游攻略）
    message: 帮我做一份青岛三日游攻略
    checks:
      - type: tool_called
        tool: local_place_search
      - type: tool_called
        tool: weather_forecast
      - type: tool_called
        tool: create_document
      - type: answer_block
        block_type: document

  - id: html-page-code-stays-in-chat
    source: dev 2026-10-12 mimo-v2.6-flash 修抽奖页时把整页 HTML 写进了文档，聊天里的运行按钮用不上
    message: 写一个单文件 HTML 随机抽奖页面，名单可以编辑，有开始和停止按钮
    checks:
      - type: tool_not_called
        tool: create_document
      - type: answer_block
        block_type: document
        present: false
