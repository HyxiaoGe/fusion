[documents]
create_description = """Create a standalone document deliverable that the user can open in a preview panel, revise over several turns, and download. Use it when the user asks for a finished artifact such as a travel guide, itinerary, plan, report, checklist or summary document, instead of writing that artifact in the chat reply.

Write the document body in Markdown (GFM: headings, lists, tables, bold, links). Do not write HTML, CSS or scripts. The following container directives render as rich components:
- Callouts: a line `:::tip`, `:::info`, `:::warning` or `:::price`, an optional label in brackets such as `:::warning[Before you go]`, the Markdown content, then a closing `:::` line.
- Timeline: `:::timeline` wrapping a bullet list; each item starts with the time range in bold, for example `- **09:00-11:05** Depart Shenzhen to Yau Ma Tei`, followed by indented details.
- Stats cards: `:::stats` wrapping a bullet list of `label: value` items, for example `- Total budget: ¥3,500-4,300`. Each value must be a short figure or phrase of a few words; put explanations, conditions and caveats in the surrounding text, not in the card value.
- Tabs: an outer `::::tabs` block containing one `:::tab[Tab label]` block per tab, each closed with `:::`, and the outer block closed with `::::`. Use tabs for parallel sections such as one tab per day.

Facts rules:
- Values that tools returned in this run (weather, routes and durations, places and their fields, flights, trains, prices, opening hours) must be copied exactly from the tool results; never replace them with remembered values.
- Content that no tool verified (general background, local tips, experience-based advice) may come from your knowledge or web results, but present it as reference information and do not state unverified specifics as confirmed facts.
- Do not write a sources or references section; the system appends the list of data sources actually queried.

Writing rules:
- Open with the takeaway: the first lines tell the reader the overall plan or answer, the key choices, and the most important risk or action, before any details.
- Lead every section with what the reader can use. Do not open the document or a section with what could not be found or confirmed.
- State each limitation once, briefly, next to the item it affects, and collect the checks the reader should make before acting into a single to-confirm or checklist section. Do not repeat the same caveat across sections or close with a disclaimer recap.
- Explain the reasoning behind non-obvious arrangements or recommendations, such as why a stop is placed in a given slot.
- When the user asks for a budget, give per-item ranges and an overall range, labeling estimated parts as estimates, instead of declining to total. Never compute from values whose usage rules forbid it; mark those items as not covered.

Write the document in the user's language. After the tool succeeds, reply to the user in 2-4 sentences summarizing what the document covers and inviting revisions; do not repeat the document content in the reply."""
create_title = """Short document title shown on the document card, at most 120 characters."""
create_content = """Complete Markdown body of the document, following the format and facts rules in the tool description. At most 60000 characters."""
