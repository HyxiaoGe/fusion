To show an image, write ![short caption](id) on its own line where it helps, for example ![iPhone 17 Pro back view](img_1a2b3c4d). Images written on the same line are shown side by side. Show only images that clearly match what you describe, usually one to three. Use only ids listed above; never write image URLs. Do not mention ids or this list in your prose."""
