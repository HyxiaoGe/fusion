[qweather]
weather_description = """Query the weather forecast for a natural-language place or the administrative area containing the device's current location. The result has a daily forecast in result.forecast_days: only the requested date when requested_date falls within the forecast window, otherwise the whole multi-day window; and, when the request covers today, tomorrow, or no specific date, a summary of the next 24 hours in result.hourly_summary, including precipitation probability; when only the requested date is returned, the summary keeps only the hours of that date within the next 24 hours. Use only fields actually returned; do not add current temperature, humidity, air quality, or alerts. Set location_source=current_location for the current device location and location_source=named for a named place. The backend must not infer the source, and coordinates must not be generated or passed. Forecasts are available for cities and districts or counties, not for whole provinces. For a place inside a city (e.g. West Lake), pass the complete place text as the user wrote it and do not add a city the user did not provide. When the user asks about a whole province or region (e.g. Hunan), query its capital or main city instead (e.g. Changsha) and say in the answer which city it represents. Call only for an affirmative target the user explicitly wants queried, never for a negated, excluded, or explicitly unwanted place. When the user affirmatively requests one exact calendar date, include requested_date in YYYY-MM-DD form, even if the date may be outside the forecast window. Omit requested_date for negated, excluded, ambiguous, relative, or unspecified dates; do not infer a year. When a combined itinerary also requests destination weather, call this tool first whenever place and date intent are clear. If it fails or cannot cover the requested information, use other announced tools such as web_search or url_read to obtain authoritative evidence, with explicit citations and coverage limits. If the date is outside the forecast window, still call and truthfully report the returned coverage status. After the call, the daily forecast gives only daytime and nighttime conditions; a question about a specific time of day can be answered more precisely only from result.hourly_summary within its window, otherwise say the daily granularity cannot confirm it. A returned condition such as "cloudy" does not prove that rain, thunder, snow, or strong wind is absent; absence must come from returned fields. When the user asks about one date and one condition, answer briefly without recapping adjacent days or unrelated metrics."""
location = """For a named place, use the complete place text explicitly supplied by the user and pair it with location_source=named; for a whole province or region, use its capital or main city instead. For the device's current location, set location=current_location and location_source=current_location."""
requested_weather_date = """One affirmative exact calendar date that the user wants checked, in YYYY-MM-DD form. Omit this field for negated or excluded dates, multiple dates, relative or unclear dates, and dates without an explicit year. This records the model's query intent; it does not change the weather provider's forecast window."""
weather_unavailable = """The weather tool returned no usable result. Answer from available information and do not fabricate weather facts."""
ambiguous_location = """The place name matches several different areas, so no forecast was fetched. Candidates: {{ candidates }}. If the conversation already makes clear which one the user means, call weather_forecast again with location set exactly to that candidate text. Otherwise ask the user which one they mean and list the candidates in plain words. Do not guess and do not fabricate weather facts."""
location_not_found = """The weather service could not find this place, so no forecast was fetched. Forecasts are available for cities and districts, not for scenic spots, streets, or buildings. If the place clearly belongs to a known city or district from the conversation, call weather_forecast again with that city or district; otherwise tell the user the place was not found and ask for its city. Do not fabricate weather facts."""
weather_usage = """Hard result-usage constraints:
- Refer only to dates, daytime and nighttime conditions, high and low temperatures, wind direction, and wind strength actually returned in result.forecast_days, plus result.hourly_summary when it is present.
- result.hourly_summary covers only its window (within the next 24 hours, and only the requested date's hours when requested_date is returned): temperature range, peak precipitation probability and its time, number of hours with precipitation, first and last precipitation times, and total precipitation. Use it to answer questions about rain or temperature within that window. Its times carry the place's local UTC offset; state them as local clock times.
- If the requested date is outside result.forecast_days and no authoritative source gives that exact date's forecast, state only that its weather is unavailable and give the returned forecast range. Do not add other days' weather or historical climate statistics.
- Do not add current temperature, humidity, air quality, alerts, flooding, congestion, or delays. Mention precipitation probability or amount only as returned in result.hourly_summary.
- resolved_location is an administrative-area resolution; do not describe it as weather for a specific building or street.
- Practical advice such as carrying an umbrella or whether conditions suit an activity should follow from the returned forecast."""
