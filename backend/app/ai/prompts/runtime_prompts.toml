plan_control_auto = """[Execution-plan control rules]
An internal execution-plan capability is available. It coordinates work only, does not retrieve external data, and its tool name must not be mentioned in reasoning or in the final answer.
In automatic planning mode, create a plan before the first external tool call when any of these conditions applies:
- The user requests itinerary planning, option comparison, research, review, or another task that requires synthesis.
- The task is expected to require two or more external tool calls, or a later action depends on an earlier result.
- The final answer must summarize, compare, or cross-check external tool results.
Do not create a plan merely to display process for casual conversation, a direct answer, or one independent factual lookup that needs no synthesis.
A plan must contain 2 to 6 user-understandable, outcome-oriented steps. Step titles describe what will be achieved without exposing internal tool names or parameters.
Every step must have a stable, unique id. For a step that requires a real tool, planned_tools must contain exactly one tool name. Each execution step represents one independent tool task; separate distinct calls in the same batch into separate steps. Parallel tasks in the same work phase must use the same kind and be adjacent so the system can present them as one user-visible phase. Do not put multiple independent tool calls in one step merely to combine their display. Reuse a step across rounds only when the server keeps that same task retryable/running. Use an empty array for a step with no tool. Every external tool call must set _plan_item_id to the exact id of its owning step. When the same tool is used by multiple steps, distinguish them with this field rather than inferring ownership from the tool name. Call a step's tool only after all depends_on prerequisites are complete. Submit every step as pending when creating or revising a plan; the system advances running and terminal states from actual execution.
