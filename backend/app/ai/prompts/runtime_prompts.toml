[ai_tools]
web_search_description = """Search the web for current information. Use this tool when:
- The user asks about the latest news, current events, or real-time data such as weather, stock prices, or sports scores.
- The request contains freshness-sensitive wording such as 'latest', 'today', 'currently', or '{{ year }}'.
- The user asks about a fact that may be uncertain or outdated.
- The user asks for current product status such as price, availability, release plans, support scope, compatibility, or official procedures.

Natural-request decision rules:
- Prefer search when the request depends on potentially changing information such as current usage, access, integration, interoperability, eligibility, support scope, compatibility, official documentation, or product updates, even if the user does not explicitly say 'search' or 'look up'.
- Do not search merely because a product, company, API, protocol, or regulation is mentioned when the request asks only for stable background, historical reasons, or a general explanation.
- Examples: How do I use WeChat A2A interoperability? What product updates has OpenAI released recently?

Search strategy:
- You control query angles, search batches, result count, languages, and whether further searching is needed. There is no fixed one-, two-, or three-search rule for ordinary questions.
- For analysis of current events, implications, or comparisons, identify complementary evidence needs: original reporting and transaction status, official business or technical relationships, and independent analysis or conflicting evidence. Start with a small set of focused queries, often 2-4, when these dimensions matter; simple factual questions may need only one.
- Issue independent queries in parallel using multiple web_search calls in the same response. Use later batches to follow evidence gaps discovered in the results, not merely to paraphrase a previous query.
- Choose count for each query (1-20, default 10); 8-10 is a useful starting point for exploratory analysis, not a required quota.
- Search in the language of the likely original sources; translated queries are useful when they reach different reporting or evidence. Answer in the user's language.
- Prefer original reporting, official announcements and direct documentation. When snippets attribute a claim to another publisher, find and read that original report or a clearly attributed accessible reproduction before claiming you verified it.
- After each batch, assess coverage, source independence, dates, and contradictions. If results are weak, irrelevant, only derivative accounts, or missing key facts, change query angle, language, domains or time range and continue searching or reading. An unread candidate does not prevent another useful search.
- Stop when the evidence supports the requested answer, not because a small number of searches succeeded. Distinguish facts from your analysis and disclose unresolved uncertainty. Do not search or read merely to fill a quota.

Do not use this tool for:
- General knowledge such as mathematical formulas, scientific principles, or established history.
- General explanations of stable background, historical causes, or known policy effects, such as why the iPhone moved from Lightning to USB-C.
- Opinion analysis, solution advice, or experience summaries that do not depend on current facts, such as the value, risks, and adoption advice for AI coding assistants.
- Coding, translation, or creative writing.
- Requests that explicitly ask for an answer from existing model knowledge.
- Casual conversation or emotional support, such as greetings, identity questions, or simple arithmetic."""
web_search_query = """A concise, focused query for one evidence need. Use the language of the likely original sources, not necessarily the user's language. For independent angles, issue separate web_search calls in the same response. Include dates only when they help: current date context is {{ year }}-{{ month }}, and {{ previous_year }} or earlier dates are valid for historical evidence. Do not automatically add the current year or repeat a query without a new evidence objective."""
web_search_count = """Requested result count for this query, from 1 to 20; default 10. Choose based on the breadth of the evidence need. The server may deduplicate results and bound snippets in context; actual providers may return fewer results."""
web_search_intent = """Search intent: quick_fact for a concise fact, freshness for current developments, comparison for comparing multiple sources, deep_research for in-depth research, and official_source when official sources should be prioritized."""
web_search_domains = """Optional domain filters: at most 5 valid domains, for example openai.com."""
web_search_recency = """Optional recency window in days, from 1 through 365. Omit for no time filter; do not exclude older original reporting needed to explain a current event."""
url = """Complete URL to read, including http:// or https://."""
