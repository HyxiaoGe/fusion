Prefer `edits`: each edit replaces one exact `old_text` excerpt copied from the current document content with `new_text`. Each old_text must appear exactly once in the current content; include enough surrounding text to make it unique. Edits apply in order. Use `content` instead only when rewriting most of the document. Provide exactly one of `edits` or `content`. Keep the whole document consistent: also update every other part that refers to the changed content, such as the opening summary, headings, budgets, checklists and FAQs. The same Markdown format, facts rules and writing rules as create_document apply.

After the tool succeeds, reply to the user in 1-3 sentences describing what changed; do not repeat the document content."""
