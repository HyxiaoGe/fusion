version: "1"
workflow: .github/workflows/_deploy-ui.yml
contract_test:
  path: .github/scripts/release-safety-contract.sh
  manifest: frontend/release-safety.yml
  pr_step: release_safety_contract
parameter_contract:
  workflow: .github/workflows/_deploy-app.yml
  app: ui
  validation_job: validate-parameters
  validation_step: app_contract
  inputs:
    app: ui
    image_repository: seanfield/fusion-ui
    health_check_endpoint: http://127.0.0.1:3000/
    migration_enabled: false
    dependency_services: api
    rollback_anchor_policy: ui-image-identity
jobs:
  prepare: validate-parameters
  publish: publish
  deploy: deploy-dev
  finalize: null
steps:
  target: validate_deploy_target
  target_job: deploy
  capture: capture_previous
  migrations: []
  candidate: deploy_candidate
  verify: [verify_candidate, verify_browser_smoke]
  rollback: rollback_previous
  cleanup: cleanup_old_images
  failure: null
  finalize: null
  finalize_failure: null
needs:
  publish: []
  deploy: [validate-parameters, publish]
  finalize: []
conditions:
  prepare: null
  publish: >-
    github.ref == 'refs/heads/master' && inputs.rollback_sha == ''
  deploy: >-
    always() && github.ref == 'refs/heads/master' &&
    needs.validate-parameters.result == 'success' &&
    (needs.publish.result == 'success' ||
    (needs.publish.result == 'skipped' && inputs.rollback_sha != ''))
  migration: null
  rollback: >-
    failure() && steps.capture_previous.outcome == 'success' &&
    steps.deploy_candidate.outcome != 'skipped'
  cleanup: success()
  failure: null
  finalize: null
  finalize_failure: null
