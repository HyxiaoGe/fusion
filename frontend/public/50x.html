<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>500 · 服务暂时不可用 - Fusion</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --muted: #737373;
    --border: #e5e5e5;
    --card: #fafafa;
    --danger: #e5484d;
    --ok: #30a46c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --muted: #a3a3a3;
      --border: #262626;
      --card: #141414;
      --danger: #f2555a;
      --ok: #3dd68c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(680px, 92vw); }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px 4px 10px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 0 0 var(--danger);
    animation: pulse 1.8s infinite;
  }
  .dot.ok { background: var(--ok); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 60%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  h1 {
    margin-top: 18px;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  h1 small { font-size: .5em; color: var(--muted); font-weight: 500; margin-left: 8px; letter-spacing: 0; }
  p.desc { margin-top: 10px; color: var(--muted); line-height: 1.7; font-size: 15px; }
  .game {
    margin-top: 28px;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  .game canvas { display: block; width: 100%; height: 180px; }
  .hud {
    position: absolute; top: 10px; right: 14px;
    font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 14px; color: var(--muted);
    pointer-events: none;
  }
  .overlay kbd {
    font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    background: var(--bg);
    border-radius: 6px;
    padding: 1px 7px;
    margin: 0 2px;
    color: var(--fg);
  }
  .row {
    margin-top: 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .retry-info { font-size: 13px; color: var(--muted); }
  .retry-info b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; }
  .btn {
    height: 38px; padding: 0 18px;
    border-radius: 10px;
    font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center;
    text-decoration: none;
    border: 1px solid var(--border);
    color: var(--fg); background: var(--bg);
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .btn:hover { background: var(--card); transform: translateY(-1px); }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.primary:hover { opacity: .88; background: var(--fg); }
  .btn:disabled { opacity: .5; cursor: progress; transform: none; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText" data-i18n="status"></span></span>
  <h1><span data-i18n="title"></span><small>500</small></h1>
  <p class="desc" data-i18n="desc"></p>

  <div class="game" id="game">
    <canvas id="c"></canvas>
    <div class="hud" id="hud">HI 00000 · 00000</div>
    <div class="overlay" id="overlay"><span data-i18n-html="start"></span></div>
  </div>

  <div class="row">
    <span class="retry-info" id="retryInfo"></span>
    <div class="actions">
      <a class="btn" href="/" data-i18n="home"></a>
      <button class="btn primary" id="retryBtn" type="button" data-i18n="retry"></button>
    </div>
  </div>
</main>

<script>
(() => {
  // 该页面在应用不可用时由边缘层直接返回，无法使用 i18next，只按浏览器语言内置两套文案。
  const MESSAGES = {
    zh: {
      pageTitle: '500 · 服务暂时不可用 - Fusion',
      status: '服务暂时不可用',
      recovered: '服务已恢复',
      title: '服务器打了个盹',
      desc: '别担心，已保存的对话不会丢失。我们会在后台自动重试，恢复后页面会自己刷新。等待的时候，帮 Fusion 跳过几个 bug 吧。',
      game: '小游戏：跳过 bug',
      start: '按 <kbd>空格</kbd> 或点击开始',
      over: '被 bug 绊倒了 · <kbd>空格</kbd> 再来一局',
      home: '返回首页',
      retry: '立即重试',
      countdown: (s) => '将在 <b id="countdown">' + s + '</b> 秒后自动重试',
      stillDown: (s) => '仍未恢复，将在 <b id="countdown">' + s + '</b> 秒后再试',
      checking: '正在检查服务状态…',
      reloading: '服务已恢复，正在刷新…',
    },
    en: {
      pageTitle: '500 · Service unavailable - Fusion',
      status: 'Service unavailable',
      recovered: 'Service restored',
      title: 'The server is taking a nap',
      desc: "Don't worry, your saved conversations are safe. We'll keep retrying in the background and reload once things are back. Meanwhile, help Fusion jump over a few bugs.",
      game: 'Mini game: jump over bugs',
      start: 'Press <kbd>Space</kbd> or click to start',
      over: 'Tripped over a bug · <kbd>Space</kbd> to play again',
      home: 'Back to home',
      retry: 'Retry now',
      countdown: (s) => 'Retrying in <b id="countdown">' + s + '</b>s',
      stillDown: (s) => 'Still down, retrying in <b id="countdown">' + s + '</b>s',
      checking: 'Checking service status…',
      reloading: 'Service restored, reloading…',
    },
  };
  const lang = /^zh/i.test(navigator.language || 'zh') ? 'zh' : 'en';
  const m = MESSAGES[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  document.title = m.pageTitle;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = m[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = m[el.dataset.i18nHtml]; });
  document.getElementById('game').setAttribute('aria-label', m.game);

  // ---------- 自动重试 ----------
  const RETRY_SECONDS = 15;
  // 直接访问 /50x.html 时它本身总是 200，必须改为探测首页，否则会无限刷新。
  const isStandalone = /\/50x\.html$/.test(location.pathname);
  const probeUrl = isStandalone ? '/' : location.href;
  let left = RETRY_SECONDS;
  let checking = false;
  const retryInfo = document.getElementById('retryInfo');
  const retryBtn = document.getElementById('retryBtn');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  retryInfo.innerHTML = m.countdown(left);

  async function check() {
    if (checking) return;
    checking = true;
    retryBtn.disabled = true;
    retryInfo.textContent = m.checking;
    try {
      const res = await fetch(probeUrl, { method: 'HEAD', cache: 'no-store' });
      if (res.ok) {
        dot.classList.add('ok');
        statusText.textContent = m.recovered;
        retryInfo.textContent = m.reloading;
        setTimeout(() => (isStandalone ? location.assign('/') : location.reload()), 600);
        return;
      }
    } catch (_) {}
    checking = false;
    retryBtn.disabled = false;
    left = RETRY_SECONDS;
    retryInfo.innerHTML = m.stillDown(left);
  }

  setInterval(() => {
    if (checking || document.hidden) return;
    left -= 1;
    const el = document.getElementById('countdown');
    if (el) el.textContent = left;
    if (left <= 0) check();
  }, 1000);
  retryBtn.addEventListener('click', check);

  // ---------- 小游戏 ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const gameBox = document.getElementById('game');
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  let W = 0, H = 180, dpr = 1, ground = 0;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.getBoundingClientRect().width;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ground = H - 34;
  }
  addEventListener('resize', resize);
  resize();

  const HI_KEY = 'fusion-500-hi';
  let hi = Number(localStorage.getItem(HI_KEY) || 0);
  let state = 'idle';
  let player, obstacles, speed, score, spawnIn, last, groundOffset, blink;

  function reset() {
    player = { x: 56, y: ground, w: 26, h: 26, vy: 0, onGround: true };
    obstacles = [];
    speed = 5.2;
    score = 0;
    spawnIn = 60;
    groundOffset = 0;
    blink = 0;
  }
  reset();

  const pad = (n) => String(Math.floor(n)).padStart(5, '0');
  function updateHud() { hud.textContent = 'HI ' + pad(hi) + ' · ' + pad(score); }
  updateHud();

  function jump() {
    if (state === 'idle' || state === 'over') {
      reset();
      state = 'run';
      overlay.style.display = 'none';
      last = performance.now();
      requestAnimationFrame(loop);
    }
    if (player.onGround) {
      player.vy = -11.2;
      player.onGround = false;
    }
  }

  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  });
  gameBox.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

  function spawn() {
    const tall = Math.random() < 0.35;
    const flying = score > 300 && Math.random() < 0.25;
    obstacles.push({
      x: W + 20,
      w: tall ? 18 : 22 + Math.random() * 10,
      h: flying ? 18 : tall ? 40 : 24,
      y: flying ? ground - 58 : ground,
      legs: Math.random() * Math.PI * 2,
      flying,
    });
    const minGap = 52 - Math.min(speed * 2, 22);
    spawnIn = minGap + Math.random() * 60;
  }

  function hit(a, b) {
    const m = 4;
    return a.x + m < b.x + b.w && a.x + a.w - m > b.x &&
           a.y - a.h + m < b.y && a.y - m > b.y - b.h;
  }

  function drawBug(o, fg, danger) {
    const cx = o.x + o.w / 2;
    const top = o.y - o.h;
    ctx.fillStyle = danger;
    ctx.beginPath();
    ctx.roundRect(o.x, top, o.w, o.h, Math.min(8, o.w / 2));
    ctx.fill();
    ctx.strokeStyle = danger;
    ctx.lineWidth = 2;
    const wiggle = Math.sin(o.legs) * 3;
    for (let i = 1; i <= 2; i++) {
      const ly = top + (o.h / 3) * i;
      ctx.beginPath(); ctx.moveTo(o.x, ly); ctx.lineTo(o.x - 6, ly + wiggle); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x + o.w, ly); ctx.lineTo(o.x + o.w + 6, ly - wiggle); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx - 3, top); ctx.lineTo(cx - 7, top - 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 3, top); ctx.lineTo(cx + 7, top - 7); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 5, top + 5, 3, 3);
    ctx.fillRect(cx + 2, top + 5, 3, 3);
  }

  function drawPlayer(fg, bg) {
    const p = player;
    const top = p.y - p.h;
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.roundRect(p.x, top, p.w, p.h, 7);
    ctx.fill();
    ctx.fillStyle = bg;
    ctx.font = '700 15px -apple-system, "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state === 'over' ? '×' : 'F', p.x + p.w / 2, top + p.h / 2 + 1);
  }

  function draw() {
    const fg = css('--fg'), bg = css('--bg'), muted = css('--muted'), border = css('--border'), danger = css('--danger');
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ground + .5); ctx.lineTo(W, ground + .5); ctx.stroke();
    ctx.fillStyle = muted;
    ctx.globalAlpha = .35;
    for (let x = -groundOffset % 40; x < W; x += 40) {
      ctx.fillRect(x, ground + 8, 10, 1.5);
      ctx.fillRect(x + 22, ground + 16, 4, 1.5);
    }
    ctx.globalAlpha = 1;

    for (const o of obstacles) drawBug(o, fg, danger);
    if (!(state === 'over' && blink % 20 > 10)) drawPlayer(fg, bg);
  }

  function loop(now) {
    if (state !== 'run') return;
    const dt = Math.min((now - last) / 16.67, 2);
    last = now;

    player.vy += 0.62 * dt;
    player.y += player.vy * dt;
    if (player.y >= ground) { player.y = ground; player.vy = 0; player.onGround = true; }

    groundOffset += speed * dt;
    spawnIn -= dt;
    if (spawnIn <= 0) spawn();
    for (const o of obstacles) { o.x -= speed * dt; o.legs += 0.35 * dt; }
    obstacles = obstacles.filter((o) => o.x + o.w > -20);

    score += 0.18 * dt * (speed / 5);
    speed = Math.min(5.2 + score / 160, 13);
    updateHud();

    if (obstacles.some((o) => hit(player, o))) {
      state = 'over';
      if (score > hi) { hi = Math.floor(score); localStorage.setItem(HI_KEY, hi); }
      updateHud();
      overlay.innerHTML = '<span>' + m.over + '</span>';
      overlay.style.display = 'grid';
      const flash = () => { blink++; draw(); if (state === 'over' && blink < 60) requestAnimationFrame(flash); };
      flash();
      return;
    }

    draw();
    requestAnimationFrame(loop);
  }

  draw();
})();
</script>
</body>
</html>
