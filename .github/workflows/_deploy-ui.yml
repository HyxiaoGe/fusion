name: Fusion UI Build & Deploy

on:
  workflow_call:
    inputs:
      app:
        description: 参数化发布的应用标识
        required: false
        default: ui
        type: string
      image_repository:
        description: ACR 应用 repository
        required: false
        default: seanfield/fusion-ui
        type: string
      health_check_endpoint:
        description: UI 健康检查端点
        required: false
        default: http://127.0.0.1:3000/
        type: string
      migration_enabled:
        description: 是否执行数据库迁移（UI 必须为 false）
        required: false
        default: false
        type: boolean
      dependency_services:
        description: 逗号分隔的运行时依赖服务
        required: false
        default: api
        type: string
      rollback_anchor_policy:
        description: 回滚运行镜像锚点策略
        required: false
        default: ui-image-identity
        type: string
      deploy_sha:
        description: orchestrator 固定的 master 提交 SHA
        required: true
        type: string
      rollback_sha:
        description: 要回滚的已发布提交 SHA；Task 2 由发布台账解析 repository digest，留空则发布当前提交
        required: false
        type: string
      rollback_reason:
        description: 手动回滚原因；设置 rollback_sha 时必填
        required: false
        type: string

permissions:
  contents: read

# Task 1 仅保留可调用外壳且没有启用调用方；Task 2 由顶层 orchestrator
# 统一持有 fusion-dev concurrency，并在解析 repository digest 后才允许部署。

# 镜像源:阿里云 ACR 个人版(深圳,境内端点);改仓名只动 IMAGE_NAME 一行
env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: ${{ format('crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/{0}', inputs.image_repository) }}
  UI_HEALTH_CHECK_ENDPOINT: ${{ inputs.health_check_endpoint }}
  DEPLOY_DEPENDENCY_SERVICES: ${{ inputs.dependency_services }}
  DEPLOY_ROLLBACK_ANCHOR_POLICY: ${{ inputs.rollback_anchor_policy }}
  ROLLBACK_SHA: ${{ inputs.rollback_sha }}
  ROLLBACK_REASON: ${{ inputs.rollback_reason }}
  DEPLOY_TARGET_SHA: ${{ inputs.rollback_sha || inputs.deploy_sha }}

jobs:
  publish:
    name: Publish master image on Windows runner
    if: >-
      github.ref == 'refs/heads/master' &&
      inputs.rollback_sha == ''
    runs-on: [self-hosted, Windows, X64, fusion-ui]
    timeout-minutes: 30
    environment:
      name: dev
      deployment: false
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NEXT_PUBLIC_AUTH_SERVICE_BASE_URL: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_BASE_URL }}
      NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID }}
      NEXT_PUBLIC_AUTH_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_AUTH_CALLBACK_URL }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%

      - name: Push CI/CD active metric
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $environment = if ($env:GITHUB_REF_NAME -eq "master") { "dev" } else { "ci" }
          $branchKey = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9_.-]', '_'
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="fusion-ui",branch="$env:GITHUB_REF_NAME",environment="$environment",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="fusion-ui",branch="$env:GITHUB_REF_NAME",environment="$environment",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try {
            # pushgateway 本体只绑 loopback,经 nginx 9094 鉴权反代推送(凭证在 dev Environment Secret)
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/fusion-ui/branch_key/$branchKey/environment_key/$environment" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5 | Out-Null
            Write-Host "CI/CD active metric pushed"
          } catch {
            Write-Host "CI/CD active metric push failed, ignored: $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test and build Docker image
        uses: ./frontend/.github/actions/windows-docker-build
        with:
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ inputs.deploy_sha }}
          auth-service-base-url: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_BASE_URL }}
          auth-service-client-id: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID }}
          auth-callback-url: ${{ vars.NEXT_PUBLIC_AUTH_CALLBACK_URL }}

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          logout: false

      - name: Push Docker image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $image = "${env:IMAGE_NAME}:${env:DEPLOY_SHA}"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            docker push $image
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              exit 0
            }

            if ($attempt -eq 4) {
              exit $exitCode
            }

            $delay = 15 * $attempt
            Write-Host "docker push 失败，第 $attempt 次，${delay}s 后重试..."
            Start-Sleep -Seconds $delay
          }

      - name: Cleanup local Docker artifacts
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $runnerKey = '${{ runner.name }}' -replace '[^A-Za-z0-9_.-]', '-'
          if (-not $runnerKey) { $runnerKey = "runner" }
          $builder = "fusion-ui-ci-$runnerKey"
          $image = "${env:IMAGE_NAME}:${env:DEPLOY_SHA}"

          # GitHub 的 PowerShell 包装器使用 ErrorActionPreference=Stop；镜像不存在是清理的正常分支，
          # 通过 cmd 静默探测，避免 native stderr 把 always cleanup 误判为失败。
          cmd /c "docker image inspect $image >NUL 2>NUL"
          if ($LASTEXITCODE -eq 0) {
            docker image rm $image
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to remove local image: $image"
            }
          }

          $pruneArgs = @(
            "buildx", "prune",
            "--builder", $builder,
            "--force",
            "--max-used-space", "25gb",
            "--reserved-space", "8gb",
            "--min-free-space", "30gb"
          )
          docker @pruneArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to prune BuildKit cache for builder: $builder"
          }

          if ($env:DOCKER_CONFIG) {
            $expectedDockerConfig = [System.IO.Path]::GetFullPath(
              (Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_JOB")
            )
            $dockerConfig = [System.IO.Path]::GetFullPath($env:DOCKER_CONFIG)
            $isExpectedPath = [string]::Equals(
              $dockerConfig,
              $expectedDockerConfig,
              [System.StringComparison]::OrdinalIgnoreCase
            )
            $hasExpectedName = (Split-Path $dockerConfig -Leaf) -like ".docker-*"
            if (-not $isExpectedPath -or -not $hasExpectedName) {
              throw "Refusing to remove unexpected Docker config path: $dockerConfig"
            }
            if (Test-Path $dockerConfig) {
              Remove-Item -Recurse -Force -Path $dockerConfig -ErrorAction Stop
            }
          }

          exit 0

  deploy-dev:
    name: Deploy master on dev server
    if: >-
      always() &&
      github.ref == 'refs/heads/master' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' &&
      inputs.rollback_sha != ''))
    needs: publish
    runs-on: [self-hosted, Linux, X64, fusion-ui]
    timeout-minutes: 25
    environment: dev

    steps:
      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout smoke scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate deployment target
        id: validate_deploy_target
        run: ops/deploy/ui-validate-deployment-target.sh
      - name: Configure Docker credential directory
        run: ops/deploy/ui-configure-docker-credential-directory.sh
      - name: Prepare stable UI runtime paths
        run: ops/deploy/ui-prepare-stable-runtime-paths.sh

      - name: Login to ACR
        run: echo "${ACR_PASSWORD}" | docker login "${REGISTRY}" -u "${ACR_USERNAME}" --password-stdin
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Capture current deployment
        id: capture_previous
        run: ops/deploy/ui-capture-current-deployment.sh
      - name: Bootstrap current UI release ledger
        env:
          PREVIOUS_SHA: ${{ steps.capture_previous.outputs.previous_sha }}
          PREVIOUS_REF: ${{ steps.capture_previous.outputs.previous_image_ref }}
          PREVIOUS_ID: ${{ steps.capture_previous.outputs.previous_image_id }}
        run: ops/deploy/ui-bootstrap-current-release-ledger.sh
      - name: Resolve UI deployment digest
        run: ops/deploy/ui-resolve-deployment-digest.sh
      - name: Deploy candidate image
        id: deploy_candidate
        run: ops/deploy/ui-deploy-candidate-image.sh
      - name: Smoke check candidate deployment
        id: verify_candidate
        run: ops/deploy/ui-smoke-check-candidate-deployment.sh
      - name: Resolve browser smoke runtime
        run: ops/deploy/ui-resolve-browser-smoke-runtime.sh
      - name: Run dev browser smoke
        id: verify_browser_smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3004
        run: ops/deploy/ui-run-dev-browser-smoke.sh
      - name: Preserve UI rollback image
        id: cleanup_old_images
        if: success()
        env:
          PREVIOUS_IMAGE_REF: ${{ steps.capture_previous.outputs.previous_image_ref }}
        run: ops/deploy/ui-preserve-rollback-image.sh
      - name: Record accepted UI release
        if: success()
        run: ops/deploy/ui-record-accepted-release.sh
      - name: Rollback previous deployment
        id: rollback_previous
        if: ${{ failure() && steps.capture_previous.outcome == 'success' && steps.deploy_candidate.outcome != 'skipped' }}
        env:
          PREVIOUS_IMAGE_REF: ${{ steps.capture_previous.outputs.previous_image_ref }}
          PREVIOUS_IMAGE_ID: ${{ steps.capture_previous.outputs.previous_image_id }}
        run: ops/deploy/ui-rollback-previous-deployment.sh
      - name: Push CI/CD metrics
        if: always()
        env:
          METRICS_REF_NAME: ${{ github.ref_name }}
          METRICS_JOB_STATUS: ${{ job.status }}
          METRICS_STARTED_AT: ${{ needs.publish.outputs.started_at }}
          METRICS_IMAGE_REF: ${{ env.DEPLOY_UI_IMAGE }}
          METRICS_TARGET_SHA: ${{ env.DEPLOY_TARGET_SHA }}
          METRICS_RUNNER_NAME: ${{ needs.publish.outputs.runner_name }}
          METRICS_DEPLOY_START: ${{ env.DEPLOY_START }}
        run: ops/deploy/ui-push-cicd-metrics.sh
      - name: 通知飞书(部署结果)
        if: always()
        continue-on-error: true
        env:
          FEISHU_INFRA_WEBHOOK: ${{ secrets.FEISHU_INFRA_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 提交信息可含任意字符,只经 env 传入 python(os.environ→json),绝不进 shell,杜绝注入。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: ops/deploy/ui-notify-feishu.sh
      - name: Cleanup Docker credential directory
        if: always()
        run: ops/deploy/ui-cleanup-docker-credential-directory.sh
