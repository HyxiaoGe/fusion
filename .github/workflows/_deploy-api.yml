name: Fusion API Windows CI
on:
  workflow_call:
    inputs:
      app: { description: 参数化发布的应用标识, required: false, default: api, type: string }
      image_repository: { description: ACR 应用 repository, required: false, default: seanfield/fusion-api, type: string }
      health_check_endpoint: { description: API 健康检查端点, required: false, default: http://127.0.0.1:8002/health, type: string }
      migration_enabled: { description: 是否执行 Alembic 迁移, required: false, default: true, type: boolean }
      dependency_services: { description: 逗号分隔的运行时依赖服务, required: false, default: "postgres,redis,litellm,flyai-adapter,knowledge-worker", type: string }
      rollback_anchor_policy: { description: 回滚运行镜像锚点策略, required: false, default: api-and-adapter-image-identities, type: string }
      deploy_sha: { description: orchestrator 固定的 master 提交 SHA, required: true, type: string }
      rollback_sha: { description: 要恢复的已发布镜像 SHA, required: false, type: string }
      rollback_reason: { description: 手动回滚原因, required: false, type: string }
permissions: { contents: read }
# 顶层 orchestrator 统一持有 fusion-dev concurrency；本 reusable workflow 不定义 concurrency。
env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: ${{ format('crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/{0}', inputs.image_repository) }}
  FLYAI_ADAPTER_IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/fusion-flyai-adapter
  API_HEALTH_CHECK_ENDPOINT: ${{ inputs.health_check_endpoint }}
  DEPLOY_DEPENDENCY_SERVICES: ${{ inputs.dependency_services }}
  DEPLOY_ROLLBACK_ANCHOR_POLICY: ${{ inputs.rollback_anchor_policy }}
jobs:
  prepare:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.deployment_request.outputs.started_at }}
      target_sha: ${{ steps.deployment_request.outputs.target_sha }}
      rollback_requested: ${{ steps.deployment_request.outputs.rollback_requested }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate deployment request
        id: deployment_request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DEPLOY_SHA: ${{ inputs.deploy_sha }}
          REQUESTED_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          REQUESTED_ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: ops/deploy/api-validate-deployment-request.sh
  publish:
    name: Publish master images on Windows runner
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.rollback_requested != 'true'
    needs: prepare
    runs-on: [self-hosted, Windows, X64, fusion-api]
    timeout-minutes: 40
    environment:
      name: dev
      deployment: false
    env:
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%
      - name: Configure Docker credential directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Push CI/CD active metric
        if: github.ref == 'refs/heads/master'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try {
            # pushgateway 本体只绑 loopback,经 nginx 9094 鉴权反代推送(凭证在仓库 Secret PUSHGW_BASIC_AUTH)
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/fusion-api/branch_key/master/environment_key/dev" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5 | Out-Null
            Write-Host "CI/CD active metric pushed"
          } catch {
            Write-Host "CI/CD active metric push failed, ignored: $($_.Exception.Message)"
          }
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify Docker access
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Docker Engine is unavailable on this runner."
            exit $LASTEXITCODE
          }
          docker ps
          if ($LASTEXITCODE -ne 0) {
            Write-Host "The runner cannot access Docker Engine."
            exit $LASTEXITCODE
          }
      - name: Test and build Docker image
        timeout-minutes: 15
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & "backend/.github/scripts/windows-build-and-test.ps1" `
            -ImageName "${env:IMAGE_NAME}" `
            -AdapterImageName "${env:FLYAI_ADAPTER_IMAGE_NAME}" `
            -ImageTag "${env:DEPLOY_SHA}"
      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          # 凭据目录由 always cleanup 统一删除，避免 post-action 在目录删除后重新创建。
          logout: false
      - name: Push Docker image
        run: |
          docker push "%IMAGE_NAME%:%DEPLOY_SHA%"
          docker push "%FLYAI_ADAPTER_IMAGE_NAME%:%DEPLOY_SHA%"
      - name: Cleanup local Docker artifacts
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & "backend/.github/scripts/windows-cleanup.ps1" `
            -ImageName "${env:IMAGE_NAME}" `
            -AdapterImageName "${env:FLYAI_ADAPTER_IMAGE_NAME}" `
            -ImageTag "${env:DEPLOY_SHA}"
  deploy-dev:
    name: Deploy master on dev server
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.prepare.result == 'success' && ((needs.prepare.outputs.rollback_requested == 'true' && needs.publish.result == 'skipped') || (needs.prepare.outputs.rollback_requested != 'true' && needs.publish.result == 'success')) }}
    needs: [prepare, publish]
    runs-on: [self-hosted, Linux, X64, fusion-api]
    timeout-minutes: 30
    environment: dev
    env:
      DEPLOY_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout smoke scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0
      - name: Configure user systemd bus
        run: ops/deploy/api-configure-user-systemd-bus.sh
      - name: Configure Docker credential directory
        run: ops/deploy/api-configure-docker-credential-directory.sh
      - name: Prepare stable runtime paths
        run: ops/deploy/api-prepare-stable-runtime-paths.sh
      - name: Capture current deployment for rollback
        id: capture_rollback_target
        run: ops/deploy/api-capture-current-deployment.sh
      - name: Login to ACR
        run: ops/deploy/api-login-to-acr.sh
        env: { ACR_USERNAME: "${{ secrets.ACR_USERNAME }}", ACR_PASSWORD: "${{ secrets.ACR_PASSWORD }}" }
      - name: Bootstrap current API release ledger
        env:
          PREVIOUS_SHA: ${{ steps.capture_rollback_target.outputs.deployment_sha }}
          PREVIOUS_API_REF: ${{ steps.capture_rollback_target.outputs.api_image_ref }}
          PREVIOUS_API_ID: ${{ steps.capture_rollback_target.outputs.api_image_id }}
          PREVIOUS_ADAPTER_REF: ${{ steps.capture_rollback_target.outputs.adapter_image_ref }}
          PREVIOUS_ADAPTER_ID: ${{ steps.capture_rollback_target.outputs.adapter_image_id }}
        run: ops/deploy/api-bootstrap-current-release-ledger.sh
      - name: Resolve API deployment digest
        env:
          ROLLBACK_REQUESTED: ${{ needs.prepare.outputs.rollback_requested }}
        run: ops/deploy/api-resolve-deployment-digest.sh
      - name: Pause model management worker before API deploy
        id: pause_model_management_worker
        env:
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.model_management_timer_active }}
        run: ops/deploy/api-pause-model-management-worker.sh
      - name: Apply alembic migrations
        id: apply_migrations
        if: inputs.migration_enabled && needs.prepare.outputs.rollback_requested != 'true'
        run: ops/deploy/api-apply-alembic-migrations.sh
      - name: Pull and restart fusion-api
        id: deploy_candidate
        env:
          ROLLBACK_REQUESTED: ${{ needs.prepare.outputs.rollback_requested }}
          DEPLOY_PROMPTHUB_API_KEY: ${{ secrets.PROMPTHUB_API_KEY }}
          DEPLOY_PROMPTHUB_SYNC_MODE: ${{ vars.PROMPTHUB_SYNC_MODE || 'disabled' }}
          DEPLOY_MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
          DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS: ${{ vars.MCP_ALLOWED_CREDENTIAL_REFS }}
          DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS: ${{ vars.MCP_CONNECT_TIMEOUT_SECONDS }}
          DEPLOY_MCP_CALL_TIMEOUT_SECONDS: ${{ vars.MCP_CALL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS: ${{ vars.MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS: ${{ vars.MCP_ADMIN_OPERATION_TIMEOUT_SECONDS }}
          DEPLOY_MCP_MAX_DISCOVERY_PAGES: ${{ vars.MCP_MAX_DISCOVERY_PAGES }}
          DEPLOY_MCP_MAX_DISCOVERED_TOOLS: ${{ vars.MCP_MAX_DISCOVERED_TOOLS }}
          DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS: ${{ vars.MCP_MAX_TOOL_DESCRIPTION_CHARS }}
          DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES: ${{ vars.MCP_MAX_TOOL_SCHEMA_BYTES }}
          DEPLOY_MCP_MAX_RESPONSE_BYTES: ${{ vars.MCP_MAX_RESPONSE_BYTES }}
          DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN: ${{ vars.MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN }}
          DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD }}
          DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS: ${{ vars.MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS }}
          DEPLOY_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEPLOY_AMAP_MCP_API_KEY: ${{ secrets.AMAP_MCP_API_KEY }}
          DEPLOY_FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
          DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS: ${{ vars.LITELLM_GOVERNANCE_MAX_AGE_SECONDS || '86400' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN: ${{ secrets.LITELLM_MODEL_ADMISSION_WORKER_TOKEN }}
          DEPLOY_KNOWLEDGE_BASE_ENABLED: ${{ vars.KNOWLEDGE_BASE_ENABLED || 'false' }}
          DEPLOY_KNOWLEDGE_MAX_FILE_SIZE: ${{ vars.KNOWLEDGE_MAX_FILE_SIZE || '10485760' }}
          DEPLOY_KNOWLEDGE_CHUNKER_VERSION: ${{ vars.KNOWLEDGE_CHUNKER_VERSION || 'chunker-v2' }}
          DEPLOY_KNOWLEDGE_EMBEDDING_MODEL: ${{ vars.KNOWLEDGE_EMBEDDING_MODEL }}
          DEPLOY_KNOWLEDGE_EMBEDDING_REVISION: ${{ vars.KNOWLEDGE_EMBEDDING_REVISION }}
          DEPLOY_KNOWLEDGE_EMBEDDING_REVISION_ROUTES: ${{ vars.KNOWLEDGE_EMBEDDING_REVISION_ROUTES }}
          DEPLOY_KNOWLEDGE_EMBEDDING_DIMENSION: ${{ vars.KNOWLEDGE_EMBEDDING_DIMENSION || '1024' }}
          DEPLOY_KNOWLEDGE_EMBEDDING_ALLOWED_DIMENSIONS: ${{ vars.KNOWLEDGE_EMBEDDING_ALLOWED_DIMENSIONS || '1024' }}
          DEPLOY_KNOWLEDGE_CHUNK_SIZE: ${{ vars.KNOWLEDGE_CHUNK_SIZE || '1200' }}
          DEPLOY_KNOWLEDGE_CHUNK_OVERLAP: ${{ vars.KNOWLEDGE_CHUNK_OVERLAP || '200' }}
          DEPLOY_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT: ${{ vars.KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT || '10000' }}
          DEPLOY_KNOWLEDGE_PARSE_TIMEOUT_SECONDS: ${{ vars.KNOWLEDGE_PARSE_TIMEOUT_SECONDS || '60' }}
          DEPLOY_KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${{ vars.KNOWLEDGE_EMBEDDING_BATCH_SIZE || '32' }}
          DEPLOY_KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${{ vars.KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS || '30' }}
          DEPLOY_KNOWLEDGE_SEARCH_MAX_PROFILES: ${{ vars.KNOWLEDGE_SEARCH_MAX_PROFILES || '8' }}
          DEPLOY_KNOWLEDGE_WORKER_POLL_SECONDS: ${{ vars.KNOWLEDGE_WORKER_POLL_SECONDS || '2' }}
          DEPLOY_KNOWLEDGE_WORKER_LEASE_SECONDS: ${{ vars.KNOWLEDGE_WORKER_LEASE_SECONDS || '180' }}
          DEPLOY_KNOWLEDGE_WORKER_HEARTBEAT_SECONDS: ${{ vars.KNOWLEDGE_WORKER_HEARTBEAT_SECONDS || '30' }}
          DEPLOY_KNOWLEDGE_WORKER_MAX_ATTEMPTS: ${{ vars.KNOWLEDGE_WORKER_MAX_ATTEMPTS || '5' }}
          DEPLOY_MILVUS_URI: ${{ vars.MILVUS_URI }}
          DEPLOY_MILVUS_USERNAME: ${{ vars.MILVUS_USERNAME }}
          DEPLOY_MILVUS_PASSWORD: ${{ secrets.MILVUS_PASSWORD }}
          DEPLOY_MILVUS_DATABASE: ${{ vars.MILVUS_DATABASE }}
          DEPLOY_MILVUS_COLLECTION_PREFIX: ${{ vars.MILVUS_COLLECTION_PREFIX || 'fusion_knowledge_chunks' }}
          DEPLOY_MILVUS_TIMEOUT_SECONDS: ${{ vars.MILVUS_TIMEOUT_SECONDS || '10' }}
          DEPLOY_MILVUS_DOCKER_NETWORK: ${{ vars.MILVUS_DOCKER_NETWORK || 'fusion_knowledge_milvus' }}
        run: ops/deploy/api-pull-and-restart.sh
      - name: Verify deployed image identity
        id: verify_image_identity
        env:
          KNOWLEDGE_WORKER_SUPPORTED: ${{ steps.deploy_candidate.outputs.knowledge_worker_supported }}
        run: ops/deploy/api-verify-image-identity.sh
      - name: Verify health
        id: verify_health
        env:
          ROLLBACK_REQUESTED: ${{ needs.prepare.outputs.rollback_requested }}
          KNOWLEDGE_WORKER_SUPPORTED: ${{ steps.deploy_candidate.outputs.knowledge_worker_supported }}
        run: ops/deploy/api-verify-health.sh
      - name: Install LiteLLM governance discovery
        if: needs.prepare.outputs.rollback_requested != 'true'
        env:
          ROLLBACK_GOVERNANCE_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.governance_timer_active }}
          ROLLBACK_COST_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.cost_timer_active }}
        run: ops/deploy/api-install-litellm-governance.sh
      - name: Install model management worker
        if: needs.prepare.outputs.rollback_requested != 'true'
        env:
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
          DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS: ${{ vars.LITELLM_GOVERNANCE_MAX_AGE_SECONDS || '86400' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN: ${{ secrets.LITELLM_MODEL_ADMISSION_WORKER_TOKEN }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.model_management_timer_active }}
        run: ops/deploy/api-install-model-management-worker.sh
      - name: Run deployment smoke
        id: deployment_smoke
        run: ops/deploy/api-run-deployment-smoke.sh
      - name: Restore model management worker for manual rollback
        if: needs.prepare.outputs.rollback_requested == 'true'
        env:
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
        run: ops/deploy/api-restore-model-management-worker-manual-rollback.sh
      - name: Preserve API rollback images
        id: cleanup_old_images
        if: success()
        env:
          ROLLBACK_API_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.api_image_ref }}
          ROLLBACK_ADAPTER_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.adapter_image_ref }}
        run: ops/deploy/api-preserve-rollback-images.sh
      - name: Record accepted API release
        if: success()
        run: ops/deploy/api-record-accepted-release.sh
      - name: Restore model management worker after pre-deploy failure
        if: ${{ failure() && steps.capture_rollback_target.outcome == 'success' && steps.pause_model_management_worker.outcome == 'success' && steps.deploy_candidate.outcome == 'skipped' }}
        env:
          ROLLBACK_MODEL_MANAGEMENT_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.model_management_timer_active }}
        run: ops/deploy/api-restore-model-management-worker-predeploy-failure.sh
      - name: Roll back failed deployment
        id: rollback_failed_deployment
        if: ${{ failure() && steps.capture_rollback_target.outcome == 'success' && steps.deploy_candidate.outcome != 'skipped' }}
        env:
          ROLLBACK_DEPLOYMENT_SHA: ${{ steps.capture_rollback_target.outputs.deployment_sha }}
          ROLLBACK_API_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.api_image_ref }}
          ROLLBACK_API_IMAGE_ID: ${{ steps.capture_rollback_target.outputs.api_image_id }}
          ROLLBACK_ADAPTER_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.adapter_image_ref }}
          ROLLBACK_ADAPTER_IMAGE_ID: ${{ steps.capture_rollback_target.outputs.adapter_image_id }}
          ROLLBACK_KNOWLEDGE_WORKER_EXISTED: ${{ steps.capture_rollback_target.outputs.knowledge_worker_existed }}
          ROLLBACK_KNOWLEDGE_WORKER_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.knowledge_worker_image_ref }}
          ROLLBACK_KNOWLEDGE_WORKER_IMAGE_ID: ${{ steps.capture_rollback_target.outputs.knowledge_worker_image_id }}
          ROLLBACK_MODEL_MANAGEMENT_CURRENT_TARGET: ${{ steps.capture_rollback_target.outputs.model_management_current_target }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_ENABLED: ${{ steps.capture_rollback_target.outputs.model_management_timer_enabled }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.model_management_timer_active }}
          ROLLBACK_GOVERNANCE_CURRENT_TARGET: ${{ steps.capture_rollback_target.outputs.governance_current_target }}
          ROLLBACK_GOVERNANCE_TIMER_ENABLED: ${{ steps.capture_rollback_target.outputs.governance_timer_enabled }}
          ROLLBACK_GOVERNANCE_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.governance_timer_active }}
          ROLLBACK_COST_TIMER_ENABLED: ${{ steps.capture_rollback_target.outputs.cost_timer_enabled }}
          ROLLBACK_COST_TIMER_ACTIVE: ${{ steps.capture_rollback_target.outputs.cost_timer_active }}
          ROLLBACK_GOVERNANCE_SERVICE_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.governance_service_unit_existed }}
          ROLLBACK_GOVERNANCE_TIMER_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.governance_timer_unit_existed }}
          ROLLBACK_GOVERNANCE_SERVICE_UNIT_B64: ${{ steps.capture_rollback_target.outputs.governance_service_unit_b64 }}
          ROLLBACK_GOVERNANCE_TIMER_UNIT_B64: ${{ steps.capture_rollback_target.outputs.governance_timer_unit_b64 }}
          ROLLBACK_COST_SERVICE_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.cost_service_unit_existed }}
          ROLLBACK_COST_TIMER_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.cost_timer_unit_existed }}
          ROLLBACK_COST_SERVICE_UNIT_B64: ${{ steps.capture_rollback_target.outputs.cost_service_unit_b64 }}
          ROLLBACK_COST_TIMER_UNIT_B64: ${{ steps.capture_rollback_target.outputs.cost_timer_unit_b64 }}
          ROLLBACK_MODEL_MANAGEMENT_SERVICE_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.model_management_service_unit_existed }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_UNIT_EXISTED: ${{ steps.capture_rollback_target.outputs.model_management_timer_unit_existed }}
          ROLLBACK_MODEL_MANAGEMENT_SERVICE_UNIT_B64: ${{ steps.capture_rollback_target.outputs.model_management_service_unit_b64 }}
          ROLLBACK_MODEL_MANAGEMENT_TIMER_UNIT_B64: ${{ steps.capture_rollback_target.outputs.model_management_timer_unit_b64 }}
          DEPLOY_PROMPTHUB_API_KEY: ${{ secrets.PROMPTHUB_API_KEY }}
          DEPLOY_PROMPTHUB_SYNC_MODE: ${{ vars.PROMPTHUB_SYNC_MODE || 'disabled' }}
          DEPLOY_MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
          DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS: ${{ vars.MCP_ALLOWED_CREDENTIAL_REFS }}
          DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS: ${{ vars.MCP_CONNECT_TIMEOUT_SECONDS }}
          DEPLOY_MCP_CALL_TIMEOUT_SECONDS: ${{ vars.MCP_CALL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS: ${{ vars.MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS: ${{ vars.MCP_ADMIN_OPERATION_TIMEOUT_SECONDS }}
          DEPLOY_MCP_MAX_DISCOVERY_PAGES: ${{ vars.MCP_MAX_DISCOVERY_PAGES }}
          DEPLOY_MCP_MAX_DISCOVERED_TOOLS: ${{ vars.MCP_MAX_DISCOVERED_TOOLS }}
          DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS: ${{ vars.MCP_MAX_TOOL_DESCRIPTION_CHARS }}
          DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES: ${{ vars.MCP_MAX_TOOL_SCHEMA_BYTES }}
          DEPLOY_MCP_MAX_RESPONSE_BYTES: ${{ vars.MCP_MAX_RESPONSE_BYTES }}
          DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN: ${{ vars.MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN }}
          DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD }}
          DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS: ${{ vars.MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS }}
          DEPLOY_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEPLOY_AMAP_MCP_API_KEY: ${{ secrets.AMAP_MCP_API_KEY }}
          DEPLOY_FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
          ROLLBACK_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ steps.capture_rollback_target.outputs.model_management_enabled }}
          ROLLBACK_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ steps.capture_rollback_target.outputs.model_admission_worker_enabled }}
          DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS: ${{ vars.LITELLM_GOVERNANCE_MAX_AGE_SECONDS || '86400' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN: ${{ secrets.LITELLM_MODEL_ADMISSION_WORKER_TOKEN }}
        run: ops/deploy/api-rollback-failed-deployment.sh
      - name: Push CI/CD metrics
        if: always()
        env:
          METRICS_REF_NAME: ${{ github.ref_name }}
          METRICS_JOB_STATUS: ${{ job.status }}
          METRICS_STARTED_AT: ${{ needs.publish.outputs.started_at || needs.prepare.outputs.started_at }}
          METRICS_RUNNER_NAME: ${{ needs.publish.outputs.runner_name || runner.name }}
          METRICS_DEPLOY_START: ${{ env.DEPLOY_START }}
        run: ops/deploy/api-push-cicd-metrics.sh
      - name: 通知飞书(部署结果)
        if: always()
        continue-on-error: true
        env:
          FEISHU_INFRA_WEBHOOK: ${{ secrets.FEISHU_INFRA_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          # 提交信息可含任意字符,只经 env 传入 python(os.environ→json),绝不进 shell,杜绝注入。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: ops/deploy/api-notify-feishu.sh
      - name: Cleanup Docker credential directory
        if: always()
        run: ops/deploy/api-cleanup-docker-credential-directory.sh
  finalize:
    name: Finalize release result
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    needs: [prepare, publish, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Finalize release result
        id: finalize_release_result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy-dev.result }}
          ROLLBACK_REQUESTED: ${{ needs.prepare.outputs.rollback_requested }}
        run: ops/deploy/api-finalize-release-result.sh
