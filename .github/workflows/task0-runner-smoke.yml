name: Task 0 runner smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要验证的 runner 平台
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

jobs:
  api-linux:
    name: API Linux runner
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: [self-hosted, Linux, X64, fusion-api]
    steps:
      - name: 输出 runner 身份
        shell: bash
        run: |
          echo "application=fusion-api"
          echo "platform=linux"

  api-windows:
    name: API Windows runner
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: [self-hosted, Windows, X64, fusion-api]
    steps:
      - name: 输出 runner 身份
        shell: pwsh
        run: |
          Write-Output "application=fusion-api"
          Write-Output "platform=windows"

  ui-linux:
    name: UI Linux runner
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: [self-hosted, Linux, X64, fusion-ui]
    steps:
      - name: 输出 runner 身份
        shell: bash
        run: |
          echo "application=fusion-ui"
          echo "platform=linux"

  ui-windows:
    name: UI Windows runner
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: [self-hosted, Windows, X64, fusion-ui]
    steps:
      - name: 输出 runner 身份
        shell: pwsh
        run: |
          Write-Output "application=fusion-ui"
          Write-Output "platform=windows"
